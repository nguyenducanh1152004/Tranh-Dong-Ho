<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2c230">
  <meta name="description" content="Portfolio của Đức Anh — lập trình viên Full Stack. Cuộn trang để xem từng bản khắc được in ra: giới thiệu, kỹ năng, dự án, kinh nghiệm và liên hệ.">
  <title>Đức Anh — Full Stack Developer</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Đức Anh">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Đức Anh — Full Stack Developer">
  <meta property="og:description" content="Mình biến ý tưởng thành sản phẩm web nhanh, đẹp và chạy ổn định.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="840">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/avatar.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Phudu:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>document.documentElement.classList.add('js'); if (location.search.indexOf('still') > -1) document.documentElement.classList.add('still');</script>
  <script src="config.js" defer></script>
  <script src="assets/art.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body class="is-loading">
  <a class="skip" href="#about">Bỏ qua phần mở đầu</a>
  <div class="grain" aria-hidden="true"></div>
  <div class="sheet-frame" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Về đầu trang">
      <span class="brand-seal">ĐA</span>
      <span class="brand-text"><strong data-bind="name"></strong><small data-bind="role"></small></span>
    </a>
    <nav class="nav" aria-label="Các mục"></nav>
  </header>

  <main>
    <section id="top" class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title" class="hero-title"><span class="hero-name" data-bind="name"></span></h1>
        <div class="hero-plate">
          <p class="hero-text"><b class="hero-role" data-bind="role"></b> — <span data-bind="tagline"></span></p>
          <div class="hero-actions">
            <a class="btn btn-ink" href="#projects">Xem dự án</a>
            <a class="btn btn-line" href="#contact">Liên hệ</a>
          </div>
        </div>
        <p class="hero-status"><span class="status-dot"></span><span data-bind="status"></span></p>
      </div>
      <div class="hero-art"></div>
      <div class="hero-seal"></div>
      <div class="hero-waves"></div>
      <p class="cue" aria-hidden="true">Cuộn để in tiếp</p>
    </section>

    <section id="about" class="sec sec-about" aria-labelledby="about-title"></section>
    <section id="skills" class="sec sec-skills" aria-labelledby="skills-title"></section>
    <section id="projects" class="sec sec-projects" aria-labelledby="projects-title"></section>
    <section id="experience" class="sec sec-exp" aria-labelledby="experience-title"></section>
    <section id="contact" class="sec sec-contact" aria-labelledby="contact-title"></section>
  </main>

  <footer class="foot">
    <p><span data-bind="name"></span> · <span data-bind="location"></span></p>
    <p>Tranh khắc vẽ bằng code, theo lối tranh Đông Hồ.</p>
  </footer>

  <dialog id="project-dialog" aria-labelledby="pd-title">
    <button class="icon-btn dialog-close" aria-label="Đóng"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="dialog-body"></div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Vui lòng bật JavaScript để xem portfolio.</p></noscript>
</body>
</html>
